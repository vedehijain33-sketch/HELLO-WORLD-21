<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101027">
  <title>About | welcome to our world</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101027;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 0;
      place-items: center;
      background:
        radial-gradient(ellipse at 18% 15%, rgb(101 72 255 / 24%), transparent 42%),
        radial-gradient(ellipse at 85% 82%, rgb(0 212 255 / 16%), transparent 38%),
        #101027;
    }

    main {
      width: min(90vw, 680px);
      padding: clamp(2.5rem, 8vw, 5rem) clamp(1.5rem, 7vw, 4.5rem);
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 28px;
      background: linear-gradient(145deg, rgb(255 255 255 / 10%), rgb(255 255 255 / 4%));
      box-shadow: 0 30px 100px rgb(0 0 0 / 35%);
      text-align: center;
      backdrop-filter: blur(18px);
      animation: arrive 900ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      margin: 0 0 1.2rem;
      color: #c3bbff;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: 1.05;
    }

    h1 span {
      background: linear-gradient(100deg, #fff 15%, #c7bcff 55%, #81eaff);
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .message {
      max-width: 34rem;
      margin: 1.6rem auto 0;
      color: #b7b7d0;
      font-size: 1.08rem;
      line-height: 1.8;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .65rem;
      margin-top: 2.2rem;
    }

    nav a {
      padding: .65rem .95rem;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 999px;
      color: #d9d5f5;
      font-size: .9rem;
      text-decoration: none;
      transition: background 180ms ease, border-color 180ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: rgb(195 187 255 / 55%);
      background: rgb(255 255 255 / 8%);
    }

    nav a[aria-current="page"] {
      border-color: rgb(195 187 255 / 45%);
      background: rgb(255 255 255 / 8%);
      color: #fff;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little about me</p>
    <h1><span>Hi, I’m Vedehi.</span></h1>
    <p class="message">Welcome to my corner of the web. This is a place to share a little about who I am and what I’m working on. I’m glad you stopped by.</p>
    <nav aria-label="Main navigation">
      <a href="hello-world.html">Home</a>
      <a href="about.html" aria-current="page">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>
</body>
</html>
