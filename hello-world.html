<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101027">
  <title>Hi, my name is vedehi</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101027;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 15%, rgb(101 72 255 / 24%), transparent 42%),
        radial-gradient(ellipse at 85% 82%, rgb(0 212 255 / 16%), transparent 38%),
        #101027;
    }

    .glow {
      position: fixed;
      width: 22rem;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 68, 68, 0.08);
      border-radius: 50%;
      box-shadow: 0 0 100px rgb(132 105 255 / 12%), inset 0 0 70px rgb(132 105 255 / 8%);
      pointer-events: none;
    }

    .glow::before,
    .glow::after {
      position: absolute;
      border: 1px solid rgb(255 255 255 / 7%);
      border-radius: 50%;
      content: "";
      inset: 12%;
    }

    .glow::after {
      inset: 25%;
    }

    main {
      position: relative;
      width: min(90vw, 680px);
      padding: clamp(2.5rem, 8vw, 5rem) clamp(1.5rem, 7vw, 4.5rem);
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 28px;
      background: linear-gradient(145deg, rgb(255 255 255 / 10%), rgb(255 255 255 / 4%));
      box-shadow: 0 30px 100px rgb(0 0 0 / 35%);
      text-align: center;
      backdrop-filter: blur(18px);
      animation: arrive 900ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.4rem;
      color: #c3bbff;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .sparkle {
      color: #8cecff;
      font-size: 1rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 10vw, 6.2rem);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: 1;
    }

    h1 span {
      display: block;
      background: linear-gradient(100deg, #fff 15%, #c7bcff 55%, #81eaff);
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .message {
      max-width: 34rem;
      margin: 1.6rem auto 0;
      color: #b7b7d0;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    .signature {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 2.2rem;
      padding: .7rem 1rem;
      border: 1px solid rgb(255 255 255 / 11%);
      border-radius: 999px;
      background: rgb(255 255 255 / 5%);
      color: #e4e3f2;
      font-size: .85rem;
    }

    .dot {
      width: .45rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #7bf0c4;
      box-shadow: 0 0 12px #7bf0c4;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: .65rem;
      margin-top: 2rem;
    }

    nav a {
      padding: .65rem .95rem;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 999px;
      color: #d9d5f5;
      font-size: .9rem;
      text-decoration: none;
      transition: background 180ms ease, border-color 180ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: rgb(195 187 255 / 55%);
      background: rgb(255 255 255 / 8%);
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <p class="eyebrow"><span class="sparkle" aria-hidden="true">✦</span> A little something to celebrate</p>
    <h1><span>Hello,</span><span>World!</span></h1>
    <p class="message">A fresh start, a blank canvas, and a whole world of possibilities. Glad you’re here.</p>
    <div class="signature"><span class="dot" aria-hidden="true"></span> All systems feeling good</div>
    <nav aria-label="Main navigation">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>
</body>
</html>
